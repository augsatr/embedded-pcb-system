<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#1a1a2e">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" fill="#00ffff" text-anchor="middle" font-weight="bold">I2C COMMUNICATION TIMING</text>
  
  <!-- SCL -->
  <text x="30" y="100" font-family="Arial" font-size="12" fill="#00ffff">SCL</text>
  <line x1="80" y1="100" x2="750" y2="100" stroke="#333" stroke-width="1"/>
  
  <!-- SCL Clock -->
  <polyline points="80,100 80,70 100,70 100,100 120,100 120,70 140,70 140,100 160,100 160,70 180,70 180,100 200,100 200,70 220,70 220,100 240,100 240,70 260,70 260,100 280,100 280,70 300,70 300,100 320,100 320,70 340,70 340,100 360,100 360,70 380,70 380,100 400,100 400,70 420,70 420,100 440,100 440,70 460,70 460,100 480,100 480,70 500,70 500,100 520,100 520,70 540,70 540,100 560,100 560,70 580,70 580,100 600,100 600,70 620,70 620,100 640,100 640,70 660,70 660,100 680,100 680,70 700,70 700,100 720,100 720,130 750,130" fill="none" stroke="#00ffff" stroke-width="2"/>
  
  <!-- SDA -->
  <text x="30" y="180" font-family="Arial" font-size="12" fill="#00ffff">SDA</text>
  <line x1="80" y1="180" x2="750" y2="180" stroke="#333" stroke-width="1"/>
  
  <!-- SDA Data -->
  <polyline points="80,180 80,150 120,150 120,180 160,180 160,150 180,150 180,180 200,180 200,150 240,150 240,180 280,180 280,150 320,150 320,180 340,180 340,150 380,150 380,180 400,180 400,150 420,150 420,180 440,180 440,150 460,150 460,180 480,180 480,150 520,150 520,180 540,180 540,150 580,150 580,180 600,180 600,150 640,150 640,180 660,180 660,150 680,150 680,180 700,180 700,150 720,150 720,180 750,180" fill="none" stroke="#00ffff" stroke-width="2"/>
  
  <!-- Annotations -->
  <rect x="80" y="200" width="100" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="130" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">START</text>
  
  <rect x="185" y="200" width="120" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="245" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">ADDR + W</text>
  
  <rect x="320" y="200" width="60" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="350" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">ACK</text>
  
  <rect x="395" y="200" width="80" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="435" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">REG ADDR</text>
  
  <rect x="490" y="200" width="60" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="520" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">ACK</text>
  
  <rect x="560" y="200" width="80" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="600" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">DATA</text>
  
  <rect x="650" y="200" width="60" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="680" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">ACK</text>
  
  <rect x="710" y="200" width="40" height="25" fill="#003333" stroke="#00ffff" stroke-width="1"/>
  <text x="730" y="217" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">STOP</text>
  
  <!-- Data bits -->
  <text x="215" y="170" font-family="Arial" font-size="8" fill="#888">0</text>
  <text x="235" y="170" font-family="Arial" font-size="8" fill="#888">1</text>
  <text x="255" y="170" font-family="Arial" font-size="8" fill="#888">1</text>
  <text x="275" y="170" font-family="Arial" font-size="8" fill="#888">1</text>
  <text x="295" y="170" font-family="Arial" font-size="8" fill="#888">0</text>
  <text x="315" y="170" font-family="Arial" font-size="8" fill="#888">1</text>
  <text x="335" y="170" font-family="Arial" font-size="8" fill="#888">1</text>
  <text x="355" y="170" font-family="Arial" font-size="8" fill="#888">0</text>
  
  <!-- Bus Speed -->
  <rect x="200" y="280" width="400" height="100" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <text x="400" y="300" font-family="Arial" font-size="12" fill="#00ffff" text-anchor="middle" font-weight="bold">I2C Bus Parameters</text>
  
  <text x="220" y="325" font-family="Arial" font-size="10" fill="#888">Clock Speed:</text>
  <text x="350" y="325" font-family="Arial" font-size="10" fill="#00ff00">100 kHz (Standard Mode)</text>
  
  <text x="220" y="345" font-family="Arial" font-size="10" fill="#888">Address:</text>
  <text x="350" y="345" font-family="Arial" font-size="10" fill="#00ff00">7-bit (0x76 for BME280)</text>
  
  <text x="220" y="365" font-family="Arial" font-size="10" fill="#888">Pull-up Resistors:</text>
  <text x="350" y="365" font-family="Arial" font-size="10" fill="#00ff00">4.7k to 3.3V</text>
  
  <text x="220" y="385" font-family="Arial" font-size="10" fill="#888">Max Devices:</text>
  <text x="350" y="385" font-family="Arial" font-size="10" fill="#00ff00">112 (7-bit addressing)</text>
</svg>
