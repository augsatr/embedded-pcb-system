<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#1a1a2e">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" fill="#00ff00" text-anchor="middle" font-weight="bold">PCB LAYOUT - TOP VIEW</text>
  
  <!-- PCB Board -->
  <rect x="100" y="60" width="600" height="480" rx="5" fill="#0a3d0a" stroke="#00aa00" stroke-width="2"/>
  
  <!-- Board Outline -->
  <rect x="110" y="70" width="580" height="460" rx="3" fill="none" stroke="#006600" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Mounting Holes -->
  <circle cx="130" cy="90" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="670" cy="90" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="130" cy="510" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="670" cy="510" r="8" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- STM32 MCU -->
  <rect x="320" y="200" width="120" height="120" rx="3" fill="#2a2a2a" stroke="#00ff00" stroke-width="2"/>
  <text x="380" y="250" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">STM32</text>
  <text x="380" y="265" font-family="Arial" font-size="10" fill="#00ff00" text-anchor="middle">F103C8T6</text>
  <text x="380" y="280" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">LQFP-48</text>
  <!-- Pin 1 marker -->
  <circle cx="328" cy="208" r="3" fill="#00ff00"/>
  
  <!-- BME280 -->
  <rect x="140" y="150" width="70" height="50" rx="3" fill="#1a1a3a" stroke="#00ffff" stroke-width="2"/>
  <text x="175" y="172" font-family="Arial" font-size="10" fill="#00ffff" text-anchor="middle">BME280</text>
  <text x="175" y="185" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">I2C</text>
  
  <!-- LSM6DS3 -->
  <rect x="590" y="150" width="70" height="50" rx="3" fill="#3a1a1a" stroke="#ff6600" stroke-width="2"/>
  <text x="625" y="172" font-family="Arial" font-size="10" fill="#ff6600" text-anchor="middle">LSM6DS3</text>
  <text x="625" y="185" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">SPI</text>
  
  <!-- LM1117 -->
  <rect x="140" y="380" width="80" height="45" rx="3" fill="#3a3a1a" stroke="#ffff00" stroke-width="2"/>
  <text x="180" y="400" font-family="Arial" font-size="10" fill="#ffff00" text-anchor="middle">LM1117</text>
  <text x="180" y="415" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">3.3V LDO</text>
  
  <!-- Crystal -->
  <rect x="460" y="230" width="40" height="25" rx="2" fill="#2a2a2a" stroke="#aaa" stroke-width="1"/>
  <text x="480" y="245" font-family="Arial" font-size="8" fill="#aaa" text-anchor="middle">8MHz</text>
  
  <!-- I2C Header (J1) -->
  <rect x="140" y="280" width="60" height="80" rx="2" fill="#1a1a1a" stroke="#00ffff" stroke-width="2"/>
  <text x="170" y="295" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">J1</text>
  <text x="170" y="308" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">I2C</text>
  <!-- Pins -->
  <circle cx="155" cy="320" r="3" fill="#ffff00"/>
  <circle cx="155" cy="330" r="3" fill="#333"/>
  <circle cx="155" cy="340" r="3" fill="#00ffff"/>
  <circle cx="155" cy="350" r="3" fill="#00ffff"/>
  <circle cx="185" cy="320" r="3" fill="#888"/>
  <circle cx="185" cy="330" r="3" fill="#888"/>
  
  <!-- SPI Header (J2) -->
  <rect x="600" y="280" width="60" height="80" rx="2" fill="#1a1a1a" stroke="#ff6600" stroke-width="2"/>
  <text x="630" y="295" font-family="Arial" font-size="9" fill="#ff6600" text-anchor="middle">J2</text>
  <text x="630" y="308" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">SPI</text>
  <!-- Pins -->
  <circle cx="615" cy="320" r="3" fill="#ffff00"/>
  <circle cx="615" cy="330" r="3" fill="#333"/>
  <circle cx="615" cy="340" r="3" fill="#ff6600"/>
  <circle cx="615" cy="350" r="3" fill="#ff6600"/>
  <circle cx="645" cy="320" r="3" fill="#ff6600"/>
  <circle cx="645" cy="330" r="3" fill="#ff6600"/>
  <circle cx="645" cy="340" r="3" fill="#00ff00"/>
  <circle cx="645" cy="350" r="3" fill="#00ff00"/>
  
  <!-- USB Connector -->
  <rect x="340" y="470" width="80" height="30" rx="3" fill="#444" stroke="#888" stroke-width="2"/>
  <text x="380" y="490" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">USB</text>
  
  <!-- LED -->
  <circle cx="500" cy="400" r="8" fill="#003300" stroke="#00ff00" stroke-width="1.5"/>
  <text x="500" y="430" font-family="Arial" font-size="8" fill="#00ff00" text-anchor="middle">LED</text>
  
  <!-- Decoupling Capacitors -->
  <rect x="280" y="180" width="15" height="8" fill="#666" stroke="#888" stroke-width="0.5"/>
  <text x="287" y="175" font-family="Arial" font-size="7" fill="#888" text-anchor="middle">C1</text>
  
  <rect x="440" y="180" width="15" height="8" fill="#666" stroke="#888" stroke-width="0.5"/>
  <text x="447" y="175" font-family="Arial" font-size="7" fill="#888" text-anchor="middle">C2</text>
  
  <!-- Traces (simplified) -->
  <line x1="210" y1="175" x2="320" y2="230" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <line x1="590" y1="175" x2="440" y2="230" stroke="#ff6600" stroke-width="1" opacity="0.6"/>
  
  <!-- Legend -->
  <rect x="100" y="550" width="600" height="40" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <rect x="120" y="560" width="15" height="10" fill="#0a3d0a" stroke="#00aa00"/>
  <text x="140" y="569" font-family="Arial" font-size="9" fill="#888">PCB Board</text>
  <rect x="220" y="560" width="15" height="10" fill="#00ffff" opacity="0.5"/>
  <text x="240" y="569" font-family="Arial" font-size="9" fill="#888">I2C Traces</text>
  <rect x="330" y="560" width="15" height="10" fill="#ff6600" opacity="0.5"/>
  <text x="350" y="569" font-family="Arial" font-size="9" fill="#888">SPI Traces</text>
  <rect x="440" y="560" width="15" height="10" fill="#ffff00" opacity="0.5"/>
  <text x="460" y="569" font-family="Arial" font-size="9" fill="#888">Power</text>
  <rect x="520" y="560" width="15" height="10" fill="#333"/>
  <text x="540" y="569" font-family="Arial" font-size="9" fill="#888">Ground Plane</text>
</svg>
