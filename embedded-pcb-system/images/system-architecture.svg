<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#1a1a2e">
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="20" fill="#00ff00" text-anchor="middle" font-weight="bold">SYSTEM ARCHITECTURE</text>
  
  <!-- STM32 MCU -->
  <rect x="300" y="150" width="200" height="100" rx="10" fill="#0d1117" stroke="#00ff00" stroke-width="2"/>
  <text x="400" y="190" font-family="Arial" font-size="14" fill="#00ff00" text-anchor="middle">STM32F103C8T6</text>
  <text x="400" y="210" font-family="Arial" font-size="11" fill="#888" text-anchor="middle">ARM Cortex-M3</text>
  <text x="400" y="225" font-family="Arial" font-size="11" fill="#888" text-anchor="middle">72MHz | 64KB Flash</text>
  
  <!-- BME280 -->
  <rect x="50" y="80" width="150" height="80" rx="8" fill="#0d1117" stroke="#00ffff" stroke-width="2"/>
  <text x="125" y="110" font-family="Arial" font-size="13" fill="#00ffff" text-anchor="middle" font-weight="bold">BME280</text>
  <text x="125" y="128" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Temperature</text>
  <text x="125" y="142" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Pressure | Humidity</text>
  
  <!-- I2C Bus -->
  <line x1="200" y1="120" x2="300" y2="180" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="240" y="140" font-family="Arial" font-size="10" fill="#00ffff">I2C</text>
  <text x="240" y="152" font-family="Arial" font-size="9" fill="#666">100kHz</text>
  
  <!-- LSM6DS3 -->
  <rect x="600" y="80" width="150" height="80" rx="8" fill="#0d1117" stroke="#ff6600" stroke-width="2"/>
  <text x="675" y="110" font-family="Arial" font-size="13" fill="#ff6600" text-anchor="middle" font-weight="bold">LSM6DS3</text>
  <text x="675" y="128" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Accelerometer</text>
  <text x="675" y="142" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Gyroscope (6-axis)</text>
  
  <!-- SPI Bus -->
  <line x1="600" y1="120" x2="500" y2="180" stroke="#ff6600" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="550" y="140" font-family="Arial" font-size="10" fill="#ff6600">SPI</text>
  <text x="550" y="152" font-family="Arial" font-size="9" fill="#666">4.5MHz</text>
  
  <!-- LM1117 -->
  <rect x="325" y="320" width="150" height="60" rx="8" fill="#0d1117" stroke="#ffff00" stroke-width="2"/>
  <text x="400" y="348" font-family="Arial" font-size="12" fill="#ffff00" text-anchor="middle" font-weight="bold">LM1117-3.3V</text>
  <text x="400" y="365" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">LDO Voltage Regulator</text>
  
  <!-- Power lines -->
  <line x1="400" y1="250" x2="400" y2="320" stroke="#ffff00" stroke-width="2"/>
  <text x="415" y="290" font-family="Arial" font-size="9" fill="#ffff00">3.3V</text>
  
  <!-- 5V Input -->
  <rect x="325" y="420" width="150" height="50" rx="8" fill="#0d1117" stroke="#ff0000" stroke-width="2"/>
  <text x="400" y="448" font-family="Arial" font-size="12" fill="#ff0000" text-anchor="middle" font-weight="bold">5V USB INPUT</text>
  
  <line x1="400" y1="380" x2="400" y2="420" stroke="#ff0000" stroke-width="2"/>
  
  <!-- UART Debug -->
  <rect x="50" y="350" width="120" height="60" rx="8" fill="#0d1117" stroke="#ff00ff" stroke-width="2"/>
  <text x="110" y="375" font-family="Arial" font-size="11" fill="#ff00ff" text-anchor="middle" font-weight="bold">UART DEBUG</text>
  <text x="110" y="395" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">115200 baud</text>
  
  <line x1="170" y1="380" x2="300" y2="220" stroke="#ff00ff" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- LED -->
  <rect x="630" y="350" width="120" height="60" rx="8" fill="#0d1117" stroke="#00ff00" stroke-width="2"/>
  <text x="690" y="375" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle" font-weight="bold">LED STATUS</text>
  <text x="690" y="395" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">PC13</text>
  
  <line x1="630" y1="380" x2="500" y2="220" stroke="#00ff00" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Legend -->
  <rect x="50" y="460" width="700" height="30" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <line x1="80" y1="475" x2="120" y2="475" stroke="#00ffff" stroke-width="2"/>
  <text x="125" y="479" font-family="Arial" font-size="9" fill="#888">I2C Bus</text>
  <line x1="200" y1="475" x2="240" y2="475" stroke="#ff6600" stroke-width="2"/>
  <text x="245" y="479" font-family="Arial" font-size="9" fill="#888">SPI Bus</text>
  <line x1="320" y1="475" x2="360" y2="475" stroke="#ffff00" stroke-width="2"/>
  <text x="365" y="479" font-family="Arial" font-size="9" fill="#888">Power</text>
  <line x1="430" y1="475" x2="470" y2="475" stroke="#ff00ff" stroke-width="2"/>
  <text x="475" y="479" font-family="Arial" font-size="9" fill="#888">Debug</text>
</svg>
