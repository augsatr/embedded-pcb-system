<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#1a1a2e">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" fill="#00ff00" text-anchor="middle" font-weight="bold">FIRMWARE ARCHITECTURE</text>
  
  <!-- Application Layer -->
  <rect x="100" y="60" width="600" height="60" rx="5" fill="#003300" stroke="#00ff00" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial" font-size="14" fill="#00ff00" text-anchor="middle" font-weight="bold">APPLICATION LAYER</text>
  <text x="400" y="105" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">main.c | Sensor Reading | Data Processing</text>
  
  <!-- Arrow -->
  <polygon points="400,130 380,125 420,125" fill="#00ff00"/>
  
  <!-- Driver Layer -->
  <rect x="100" y="140" width="600" height="80" rx="5" fill="#002244" stroke="#00aaff" stroke-width="2"/>
  <text x="400" y="165" font-family="Arial" font-size="14" fill="#00aaff" text-anchor="middle" font-weight="bold">DRIVER LAYER</text>
  
  <rect x="120" y="180" width="130" height="30" rx="3" fill="#0d1117" stroke="#00ffff" stroke-width="1"/>
  <text x="185" y="200" font-family="Arial" font-size="10" fill="#00ffff" text-anchor="middle">I2C Driver</text>
  
  <rect x="270" y="180" width="130" height="30" rx="3" fill="#0d1117" stroke="#ff6600" stroke-width="1"/>
  <text x="335" y="200" font-family="Arial" font-size="10" fill="#ff6600" text-anchor="middle">SPI Driver</text>
  
  <rect x="420" y="180" width="130" height="30" rx="3" fill="#0d1117" stroke="#ffff00" stroke-width="1"/>
  <text x="485" y="200" font-family="Arial" font-size="10" fill="#ffff00" text-anchor="middle">BME280 Driver</text>
  
  <rect x="570" y="180" width="120" height="30" rx="3" fill="#0d1117" stroke="#ff6600" stroke-width="1"/>
  <text x="630" y="200" font-family="Arial" font-size="10" fill="#ff6600" text-anchor="middle">LSM6DS3 Driver</text>
  
  <!-- Arrow -->
  <polygon points="400,230 380,225 420,225" fill="#00aaff"/>
  
  <!-- HAL Layer -->
  <rect x="100" y="240" width="600" height="60" rx="5" fill="#332200" stroke="#ffff00" stroke-width="2"/>
  <text x="400" y="265" font-family="Arial" font-size="14" fill="#ffff00" text-anchor="middle" font-weight="bold">HAL LAYER (Hardware Abstraction)</text>
  <text x="400" y="285" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">hal.h | hal.c | GPIO | Delay | UART</text>
  
  <!-- Arrow -->
  <polygon points="400,310 380,305 420,305" fill="#ffff00"/>
  
  <!-- Hardware Layer -->
  <rect x="100" y="320" width="600" height="80" rx="5" fill="#330000" stroke="#ff0000" stroke-width="2"/>
  <text x="400" y="345" font-family="Arial" font-size="14" fill="#ff0000" text-anchor="middle" font-weight="bold">HARDWARE LAYER</text>
  
  <rect x="120" y="360" width="100" height="30" rx="3" fill="#0d1117" stroke="#00ff00" stroke-width="1"/>
  <text x="170" y="380" font-family="Arial" font-size="9" fill="#00ff00" text-anchor="middle">STM32F103</text>
  
  <rect x="240" y="360" width="80" height="30" rx="3" fill="#0d1117" stroke="#00ffff" stroke-width="1"/>
  <text x="280" y="380" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">I2C Bus</text>
  
  <rect x="340" y="360" width="80" height="30" rx="3" fill="#0d1117" stroke="#ff6600" stroke-width="1"/>
  <text x="380" y="380" font-family="Arial" font-size="9" fill="#ff6600" text-anchor="middle">SPI Bus</text>
  
  <rect x="440" y="360" width="80" height="30" rx="3" fill="#0d1117" stroke="#00ffff" stroke-width="1"/>
  <text x="480" y="380" font-family="Arial" font-size="9" fill="#00ffff" text-anchor="middle">BME280</text>
  
  <rect x="540" y="360" width="80" height="30" rx="3" fill="#0d1117" stroke="#ff6600" stroke-width="1"/>
  <text x="580" y="380" font-family="Arial" font-size="9" fill="#ff6600" text-anchor="middle">LSM6DS3</text>
  
  <!-- Test Layer -->
  <rect x="100" y="420" width="600" height="60" rx="5" fill="#2a0033" stroke="#ff00ff" stroke-width="2"/>
  <text x="400" y="445" font-family="Arial" font-size="14" fill="#ff00ff" text-anchor="middle" font-weight="bold">TEST LAYER</text>
  <text x="400" y="465" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">hardware_test.c | Virtual Tests | Debug Console</text>
  
  <!-- Side Labels -->
  <text x="50" y="90" font-family="Arial" font-size="10" fill="#666" transform="rotate(-90 50 90)">High Level</text>
  <text x="50" y="360" font-family="Arial" font-size="10" fill="#666" transform="rotate(-90 50 360)">Low Level</text>
</svg>
